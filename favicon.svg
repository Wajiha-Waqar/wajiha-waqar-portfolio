<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%"><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:creator>RealFaviconGenerator</dc:creator><dc:source>https://realfavicongenerator.net</dc:source></rdf:Description></rdf:RDF></metadata><defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&amp;display=swap');
    </style>
    
    <!-- Primary Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"></stop>
      <stop offset="100%" stop-color="#1E3A8A"></stop>
    </linearGradient>
    
    <!-- Subtle Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"></stop>
    </linearGradient>
    
    <!-- Circular Clip Path -->
    <clipPath id="circleClip">
      <circle cx="300" cy="300" r="290"></circle>
    </clipPath>
    
    <!-- Drop Shadow for the Text -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"></feDropShadow>
    </filter>
  </defs><g clip-path="url(#circleClip)">
    <!-- Base Circle -->
    <circle cx="300" cy="300" r="300" fill="url(#bgGrad)"></circle>

    <!-- Decorative Inner Rings for a Premium Tech Feel -->
    <circle cx="300" cy="300" r="260" fill="none" stroke="url(#ringGrad)" stroke-width="2.5"></circle>
    <circle cx="300" cy="300" r="240" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="8 8"></circle>

    <!-- "WW" Monogram Text -->
    <text x="300" y="305" font-family="'Inter', sans-serif" font-size="210" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="-12" filter="url(#shadow)">
      WW
    </text>

    <!-- Visual Anchor (Balance Element) -->
    <rect x="250" y="390" width="100" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.95"></rect>
    <circle cx="300" cy="403" r="4" fill="#ffffff" fill-opacity="0.95"></circle>
    
    <!-- Accent Dots (Modern Minimalist Touch) -->
    <circle cx="140" cy="140" r="5" fill="#ffffff" fill-opacity="0.3"></circle>
    <circle cx="460" cy="460" r="7" fill="#ffffff" fill-opacity="0.5"></circle>
  </g><circle cx="300" cy="300" r="296" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"></circle><style>@media (prefers-color-scheme: light) { :root { filter: none; } }
@media (prefers-color-scheme: dark) { :root { filter: none; } }
</style></svg>